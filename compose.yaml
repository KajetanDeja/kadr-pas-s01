services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kadr}
    ports: ["127.0.0.1:54320:5432"]
    volumes: ["kadr-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD}
      POSTGRES_DB: kadr_test
    ports: ["127.0.0.1:54321:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d kadr_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  kadr-data:
